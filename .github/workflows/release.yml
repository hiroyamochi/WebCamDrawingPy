# v* のタグを push すると Windows 版の exe を作って GitHub Release に置く
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Build
        run: .\build.ps1 -Version ${{ github.ref_name }}

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create ${{ github.ref_name }} dist/WebCamDrawing-${{ github.ref_name }}-windows.exe --title ${{ github.ref_name }} --generate-notes
